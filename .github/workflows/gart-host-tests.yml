name: GART host tests

on:
  push:
    branches:
      - lucas-development
    paths:
      - "src/navi48-bringup/src/amd/**"
      - "src/navi48-bringup/tests/gart_range_allocator/**"
      - ".github/workflows/gart-host-tests.yml"
  pull_request:
    paths:
      - "src/navi48-bringup/src/amd/**"
      - "src/navi48-bringup/tests/gart_range_allocator/**"
      - ".github/workflows/gart-host-tests.yml"

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ make
      - name: Reject unchecked HDP and SDMA writeback calls
        run: |
          if grep -RInE '^[[:space:]]*(amdgpu_hdp_flush|gmc_hdp_flush)\([^;]*\);[[:space:]]*$' src/navi48-bringup/src; then
            echo "::error::Unchecked HDP flush call found"
            exit 1
          fi
          if grep -RInE '^[[:space:]]*sdma_wb_write32\(dev,' src/navi48-bringup/src; then
            echo "::error::Unchecked SDMA writeback call found"
            exit 1
          fi
      - name: Build and run allocator and lifecycle tests
        run: make -C src/navi48-bringup/tests/gart_range_allocator clean test
      - name: Run ThreadSanitizer concurrency tests
        run: make -C src/navi48-bringup/tests/gart_range_allocator test-tsan
